<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <title>Benin Maps</title>

    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
        }
        #map {
            width: 100%;
            height: 100%;
        }
    </style>

    <!-- MapLibre -->
    <link href="https://unpkg.com/maplibre-gl@3.6.0/dist/maplibre-gl.css" rel="stylesheet" />
    <script src="https://unpkg.com/maplibre-gl@3.6.0/dist/maplibre-gl.js"></script>
</head>

<body>

<div id="map"></div>

<script>
    const map = new maplibregl.Map({
        container: 'map',
        style: 'style.json',  // Le style local
        center: [2.311592, 9.210697], // Centre approximatif du Bénin
        zoom: 7
    });

    map.addControl(new maplibregl.NavigationControl());
</script>

</body>
</html>
